<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>園遊會點餐系統</title>
  <style>
    :root {
      --ink: #27352f;
      --green: #416b55;
      --cream: #faf8f1;
      --orange: #f1a45e;
      --muted: #737b74;
      --line: #e7e5dc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    header {
      background: var(--green);
      color: white;
      padding: 30px 20px;
      text-align: center;
    }
    header .tag {
      display: inline-block;
      border: 1px solid #ffffff80;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    h1 { margin: 5px 0 10px; font-size: 30px; }
    header p { margin: 0; color: #e7efe8; font-size: 14px; }
    main { max-width: 900px; margin: 26px auto; padding: 0 16px 50px; }
    .notice {
      background: #fff0dc;
      border: 1px solid #f5d5ad;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 22px;
    }
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 26px 0 14px;
    }
    h2 { font-size: 21px; margin: 0; }
    .muted { color: var(--muted); font-size: 13px; }
    #products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }
    .product {
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
    }
    .product h3 { margin: 0 0 8px; font-size: 18px; }
    .price { color: var(--green); font-size: 20px; font-weight: 800; }
    .sold { color: #b34a40; font-size: 13px; }
    button {
      border: 0;
      border-radius: 10px;
      background: var(--green);
      color: white;
      padding: 11px 15px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .product button { width: 100%; margin-top: 14px; }
    .cart, .result {
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      margin-top: 14px;
    }
    .cart-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 12px;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }
    .cart-row:last-child { border-bottom: 0; }
    .qty { display: flex; align-items: center; gap: 10px; }
    .qty button { padding: 5px 10px; }
    .total {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: 800;
      padding: 18px 0;
    }
